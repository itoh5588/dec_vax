set cpu 32m
set rp0 noautosize
set rp0 rp07
att rp0 disk0.rp07
att tu0 -n boot.tap
set tto 7b
set rl dis
set tq dis
set rq dis
set hk dis
set ry dis
set lpt dis
set ts dis
load -o stand/boot 0
dep r10 0
dep r11 0
expect ":" send "hp(0,0)vmunix\r"; continue
expect "root device?" send "hp0\r"; continue
expect "# " send "grep -v hp0g /etc/fstab.rp07 > /etc/fstab; cat /etc/fstab; cp /etc/ttys /etc/ttys.orig; sed -e '/^tty0[1-7]/s/on/off/' /etc/ttys.orig > /etc/ttys; grep tty0 /etc/ttys; echo STEP1 END\r"
go 2
expect "STEP1 END\r\n# " send "cd /dev; sh MAKEDEV dz0; ls /dev/tty0*; cd /; dd if=/boot of=/dev/rmt12 bs=10240; sync; sync; echo STEP2 END\r"
go
expect "STEP2 END\r\n# " send "sync\r"
go
echo inst3: DONE
exit
