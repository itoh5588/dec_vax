set cpu 32m
set rp0 noautosize
set rp0 rp07
att rp0 disk0.rp07
att tu0 43.tap
set tto 7b
set rl dis
set tq dis
set rq dis
set hk dis
set ry dis
set lpt dis
set ts dis
load -o stand/boot 0
dep r10 0
dep r11 0
expect ":" send "hp(0,0)vmunix\r"; continue
expect "root device?" send "hp0\r"; continue
expect "# " send "ls /etc/fstab* ; grep -n rp07 /etc/disktab | head -3\r"
go 2
expect "# " send "cd /dev; sh ./MAKEDEV ht0; ls -l rmt12; cd /\r"
go
expect "# " send "newfs hp0h rp07\r"
go
expect "# " send "mount /dev/hp0h /usr; cd /usr; mkdir sys; cd sys; mt rew; mt fsf 3; tar xpbf 20 /dev/rmt12; echo SRCSYS DONE\r"
go
expect "SRCSYS DONE\r\n# " send "cd ..; mt fsf; tar xpbf 20 /dev/rmt12; echo USR DONE\r"
go
expect "USR DONE\r\n# " send "cd /; chmod 755 / /usr /usr/sys; rm -rf sys; ln -s /usr/sys sys; umount /dev/hp0h; fsck /dev/rhp0h; echo FSCK DONE\r"
go
expect "FSCK DONE\r\n# " send "ls /etc/fstab*; df; sync; sync; sync; echo ALL DONE\r"
go
expect "ALL DONE\r\n# " send "sync\r"
go
echo inst2: DONE
exit
