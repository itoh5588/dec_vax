set cpu 32m
set rp0 noautosize
set rp0 rp07
att rp0 -n disk0.rp07
set rp1 noautosize
set rp1 rp07
att rp1 miniroot.rp07
att tu0 43.tap
set tto 7b
set rl dis
set tq dis
set rq dis
set hk dis
set ry dis
set lpt dis
set ts dis
load -o stand/boot 0
dep r10 0
dep r11 0
expect ":" send "hp(1,0)vmunix\r"; continue
expect "root device?" send "hp1\r"
go 2
expect "# " send "cd /dev; ./MAKEDEV hp0; cd /\r"
go
expect "# " send "disk=hp0 type=rp07 tape=ht xtr\r"
go
expect "Root filesystem extracted" send "sync\r"
go
expect "# " send "sync\r"
go
expect "# " send "sync\r"
go
echo inst1: DONE
exit
